<!DOCTYPE html>
<!-- MIT licensed demo implementation: /js/demo-scroll.js; READER-TECHNIQUES.md -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuous-scroll pdf.js reader demo — HSCPapers</title>
<style>
  :root { --accent: #4f46e5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f4f5fa; color: #1c2333; display: flex; flex-direction: column; height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e2e5f0; padding: .5rem .9rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  header b { font-size: .95rem; }
  header a { color: var(--accent); font-size: .82rem; text-decoration: none; }
  #url { flex: 1; min-width: 260px; padding: .45rem .7rem; border: 1px solid #d6d9e6; border-radius: 8px; font-size: .85rem; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: .45rem .9rem; font-weight: 700; cursor: pointer; font-size: .85rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .scroller { flex: 1; overflow: auto; background: #e9ecf3; text-align: center; }
  .rpage { position: relative; margin: 1rem auto; width: min(96%, 860px); background: #eef0f6; box-shadow: 0 2px 14px rgba(10,15,40,.25); overflow: hidden; }
  .rpage::before { content: attr(data-n); position: absolute; inset: 0; display: grid; place-items: center; color: #aab2c8; font: 800 2.2rem system-ui; }
  .rpage.done { background: #fff; }
  .rpage.done::before { content: none; }
  .rpage canvas { display: block; width: 100%; height: auto; }
  .rpage.rerr::before { content: "⚠ " attr(data-n); color: #dc2626; font-size: 1.2rem; }
  .meta { font-size: .78rem; color: #6b7280; padding: .3rem .6rem; text-align: center; }
  #err { color: #dc2626; padding: 1rem; font-weight: 700; display: none; }
</style>
</head>
<body>
<header>
  <b>Continuous-scroll reader demo</b>
  <span style="font-size:.72rem;color:#6b7280">MIT · techniques writeup in the HSCPapers repo</span>
  <input id="url" type="text" spellcheck="false" placeholder="Paste a CORS-enabled PDF URL…">
  <button id="loadBtn">Load</button>
  <span class="meta" id="pageMeta">–</span>
  <a href="/">← back to HSCPapers</a>
</header>
<div class="scroller" id="scroller"></div>
<div id="err"></div>
<script src="/js/pdf-engine.js"></script>
<script src="/js/demo-scroll.js"></script>
</body>
</html>
