<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuous-scroll pdf.js reader demo — HSCPapers</title>
<style>
  :root { --accent: #4f46e5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f4f5fa; color: #1c2333; display: flex; flex-direction: column; height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e2e5f0; padding: .5rem .9rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  header b { font-size: .95rem; }
  header a { color: var(--accent); font-size: .82rem; text-decoration: none; }
  #url { flex: 1; min-width: 260px; padding: .45rem .7rem; border: 1px solid #d6d9e6; border-radius: 8px; font-size: .85rem; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: .45rem .9rem; font-weight: 700; cursor: pointer; font-size: .85rem; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .scroller { flex: 1; overflow: auto; background: #e9ecf3; text-align: center; }
  .rpage { position: relative; margin: 1rem auto; width: min(96%, 860px); background: #eef0f6; box-shadow: 0 2px 14px rgba(10,15,40,.25); overflow: hidden; }
  .rpage::before { content: attr(data-n); position: absolute; inset: 0; display: grid; place-items: center; color: #aab2c8; font: 800 2.2rem system-ui; }
  .rpage.done { background: #fff; }
  .rpage.done::before { content: none; }
  .rpage canvas { display: block; width: 100%; height: auto; }
  .rpage.rerr::before { content: "⚠ " attr(data-n); color: #dc2626; font-size: 1.2rem; }
  .meta { font-size: .78rem; color: #6b7280; padding: .3rem .6rem; text-align: center; }
  #err { color: #dc2626; padding: 1rem; font-weight: 700; display: none; }
</style>
</head>
<body>
<header>
  <b>Continuous-scroll reader demo</b>
  <span style="font-size:.72rem;color:#6b7280">MIT · techniques writeup in the HSCPapers repo</span>
  <input id="url" type="text" spellcheck="false" placeholder="Paste a CORS-enabled PDF URL…">
  <button id="loadBtn">Load</button>
  <span class="meta" id="pageMeta">–</span>
  <a href="/">← back to HSCPapers</a>
</header>
<div class="scroller" id="scroller"></div>
<div id="err"></div>

<script src="/pdfjs/pdf.min.js"></script>
<script>
(() => {
  "use strict";
  const DEFAULT_URL = "https://pub-ec23c9b69d2544938d816ad28ee491fd.r2.dev/papers/Chemistry/2024/2024-chemistry-barker-paper-00006er22x.pdf";
  const ROOT_MARGIN = 900;      // IntersectionObserver margin (px)
  const MAX_CONCURRENT = 3;     // lazy render queue cap
  const UNLOAD_VHS = 2.5;       // unload rendered pages beyond 2.5 viewport-heights
  const SCALE = 1.6;

  const $ = (s) => document.querySelector(s);
  const scroller = $("#scroller"), errBox = $("#err"), meta = $("#pageMeta");

  let doc = null, numPages = 0, page = 1, pages = [], queue = [], inFlight = 0;
  let observer = null, scrollTick = false, dims = null;

  function fail(msg) { errBox.style.display = "block"; errBox.textContent = msg; }
  function clearErr() { errBox.style.display = "none"; errBox.textContent = ""; }

  function setMeta() {
    const rendered = pages.filter(p => p.rendered).length;
    meta.textContent = `page ${page} / ${numPages} · ${rendered} rendered in memory`;
  }

  async function load(url) {
    clearErr();
    if (observer) { observer.disconnect(); observer = null; }
    doc = null; pages = []; queue = []; inFlight = 0; page = 1;
    scroller.innerHTML = ""; scroller.scrollTop = 0;
    setMeta();
    try {
      doc = await window.pdfjsLib.getDocument({ url }).promise;
      numPages = doc.numPages;
      const p1 = await doc.getPage(1);
      const vp1 = p1.getViewport({ scale: 1 });
      dims = { w: vp1.width, h: vp1.height };
      const frag = document.createDocumentFragment();
      for (let n = 1; n <= numPages; n++) {
        const d = document.createElement("div");
        d.className = "rpage";
        d.dataset.n = String(n);
        d.style.aspectRatio = `${vp1.width} / ${vp1.height}`;
        const cv = document.createElement("canvas");
        d.appendChild(cv);
        frag.appendChild(d);
        pages.push({ el: d, canvas: cv, rendered: false, rendering: false, pageRef: null, dead: false });
      }
      scroller.appendChild(frag);
      setupObserver();
      wireScroll();
      queueRender(1); // eager first page
      setMeta();
    } catch (e) {
      fail("Could not load PDF: " + (e?.message || e) + " — the URL must be CORS-enabled or same-origin.");
    }
  }

  function queueRender(n) {
    const pg = pages[n - 1];
    if (!doc || !pg || pg.rendered || pg.rendering || queue.includes(n)) return;
    queue.push(n);
    queue.sort((a, b) => Math.abs(a - page) - Math.abs(b - page));
    pump();
  }
  function pump() {
    while (inFlight < MAX_CONCURRENT && queue.length) {
      const n = queue.shift();
      const pg = pages[n - 1];
      if (pg.rendered || pg.rendering) continue;
      inFlight++;
      renderAt(n).finally(() => { inFlight--; pump(); });
    }
  }
  async function renderAt(n) {
    const pg = pages[n - 1];
    if (!doc || !pg || pg.rendered) return;
    pg.rendering = true;
    try {
      const p = await doc.getPage(n);
      if (pg.dead) return;
      pg.pageRef = p;
      const vp = p.getViewport({ scale: SCALE });
      const cv = pg.canvas;
      cv.width = vp.width; cv.height = vp.height;
      await p.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      if (pg.dead) return;
      pg.rendered = true;
      pg.el.classList.add("done");
      pg.el.classList.remove("rerr");
      setMeta();
    } catch {
      if (!pg.dead) pg.el.classList.add("rerr");
    } finally {
      pg.rendering = false;
    }
  }
  function setupObserver() {
    observer = new IntersectionObserver((entries) => {
      for (const en of entries) if (en.isIntersecting) queueRender(Number(en.target.dataset.n));
    }, { root: scroller, rootMargin: `${ROOT_MARGIN}px 0px` });
    for (const pg of pages) observer.observe(pg.el);
  }
  function wireScroll() {
    scroller.onscroll = () => {
      if (scrollTick) return;
      scrollTick = true;
      requestAnimationFrame(() => { scrollTick = false; onScroll(); });
    };
  }
  function onScroll() {
    if (!doc || !pages.length) return;
    const half = scroller.clientHeight * 0.4;
    let cur = 1;
    for (let i = 0; i < pages.length; i++) {
      if (pages[i].el.offsetTop <= scroller.scrollTop + half) cur = i + 1;
      else break;
    }
    sweep(scroller.scrollTop, scroller.clientHeight);
    if (cur !== page) { page = cur; setMeta(); }
    pump();
  }
  function sweep(top, vh) {
    const mid = top + vh / 2;
    for (const pg of pages) {
      if (!pg.rendered || pg.rendering) continue;
      if (Math.abs(pg.el.offsetTop + pg.el.offsetHeight / 2 - mid) > vh * UNLOAD_VHS) {
        pg.rendered = false;
        pg.el.classList.remove("done");
        pg.canvas.width = pg.canvas.height = 0;
        try { pg.pageRef?.destroy(); } catch {}
        pg.pageRef = null;
      }
    }
  }
  function jump(n) {
    if (!doc) return;
    const t = Math.max(1, Math.min(n, numPages));
    pages[t - 1].el.scrollIntoView({ block: "start", behavior: "auto" });
    onScroll();
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown") jump(page + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") jump(page - 1);
  });

  $("#loadBtn").addEventListener("click", () => load($("#url").value.trim()));
  $("#url").addEventListener("keydown", (e) => { if (e.key === "Enter") load($("#url").value.trim()); });

  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.min.js";
    $("#url").value = DEFAULT_URL;
    load(DEFAULT_URL);
  } else {
    fail("pdf.js is still loading — click Load in a second.");
  }
})();
</script>
</body>
</html>
