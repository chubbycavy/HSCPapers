# Nightly catalogue rebuild: THSC listings + NESA + mirrors -> papers.json.
# The commit to main triggers the Cloudflare Pages redeploy automatically.
name: rebuild-catalogue

on:
  schedule:
    - cron: "0 20 * * *" # 06:00 AEST — daily, before the school day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Identity and reconciliation regression checks
        working-directory: desktop
        run: node --test tools/tests/catalogue-reconcile.test.cjs

      - name: Rebuild catalogue
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # authenticated API: 1,000/hr vs 60/hr on shared runner IPs
        run: node --require ./tools/tests/no-local-ingest.cjs tools/build-index.cjs --no-cache

      - name: Verify canonical catalogue before publishing
        working-directory: desktop
        run: node tools/verify-catalogue.cjs

      - name: Commit (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the full regenerated surface: catalogue + the generators' artifacts
          # (sitemap lastmod, coverage dashboard, subject pages, the SPA shell's
          # static subject grid) — regenerating without committing discards them
          git add desktop/ui/data/papers.json desktop/ui/sitemap.xml desktop/ui/coverage.html desktop/ui/index.html desktop/ui/subjects/ desktop/tools/thsc-au-verified.json desktop/tools/reconciliation-report.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged — no commit"
          else
            git commit -m "catalogue: nightly rebuild ($(date -u +%F))"
            git push
          fi
